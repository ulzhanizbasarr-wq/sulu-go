<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf6f2"><title>SULU GO — Beauty booking demo</title><style>
:root{--ink:#33242b;--muted:#85747a;--pink:#a94d70;--light:#fbf6f2;--line:#eadde0;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:3;background:#fffdfbea;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.top{max-width:1100px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:2px;color:var(--pink)}.sub{font-size:10px;letter-spacing:2px;color:var(--muted)}.role{display:flex;gap:5px;flex-wrap:wrap}button{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 15px;color:var(--ink)}button.primary,.role button.active{background:var(--pink);border-color:var(--pink);color:white}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:1100px;margin:auto;padding:25px 22px 70px}.hero{border-radius:25px;min-height:280px;background:linear-gradient(90deg,#3a252eeb,#58324066),url('https://images.unsplash.com/photo-1560066984-138dadb4c035?w=1400&q=85') center/cover;color:white;display:flex;align-items:center;padding:38px;margin-bottom:28px}.hero h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(34px,5vw,59px);margin:10px 0}.hero p{max-width:490px;line-height:1.6}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card,.panel{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}.card img{width:100%;height:170px;object-fit:cover}.cardbody{padding:17px}.card h3{margin:5px 0;font-family:Georgia,serif;font-size:23px;font-weight:normal}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;background:#f8e9ef;color:#974b67;border-radius:20px;padding:5px 9px;font-size:12px}.panel{padding:22px;margin-bottom:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.section{font-family:Georgia,serif;font-size:31px;font-weight:normal;margin:25px 0 14px}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:13px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;background:white;color:var(--ink)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.slots{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.slots button.selected{background:#f8e9ef;border-color:var(--pink);color:var(--pink)}.notice{background:#f9edf1;border:1px solid #ebced9;border-radius:14px;padding:13px;margin:14px 0;font-size:13px;line-height:1.5}.item{padding:16px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.danger{color:#9e3650}.success{color:#297c55}.hide{display:none!important}footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}.stat{background:#fff;border:1px solid var(--line);padding:20px;border-radius:18px}.stat strong{font-size:30px;display:block;margin-top:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#382832;color:white;padding:14px 20px;border-radius:13px;z-index:9;box-shadow:0 12px 30px #0002;max-width:90%;text-align:center}.tiny{font-size:11px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.hero{min-height:250px;padding:25px}.top{align-items:flex-start;flex-direction:column}.role button{padding:9px 11px;font-size:13px}.wrap{padding:17px 14px 50px}.panel{padding:16px}.section{font-size:27px}}
</style></head><body><header><div class="top"><div><div class="brand">SULU GO</div><div class="sub">BEAUTY ON YOUR TIME</div></div><nav class="role"><button data-role="client" class="active">Клиент</button><button data-role="master">Мастер</button><button data-role="owner">Владелец</button></nav></div></header><main class="wrap"><div id="app"></div></main><footer>Концепт SULU GO · Все салоны, имена и цены демонстрационные · Оплата не принимается</footer><script>
const salons=[{id:'nuva',name:'NUVA BEAUTY · концепт',district:'Отеген Батыр',img:'https://images.unsplash.com/photo-1560066984-138dadb4c035?w=700&q=80',masters:[{id:'a',name:'Алина',job:'Nail-мастер'},{id:'d',name:'Диана',job:'Стилист'}],services:[{id:'nail',name:'Маникюр с покрытием',price:10000,duration:90,master:'a'},{id:'hair',name:'Стрижка и укладка',price:12000,duration:60,master:'d'}]},{id:'muse',name:'MUSE STUDIO',district:'Алмалинский район',img:'https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?w=700&q=80',masters:[{id:'m',name:'Мадина',job:'Бровист'}],services:[{id:'brow',name:'Коррекция и окрашивание бровей',price:8000,duration:60,master:'m'}]},{id:'luna',name:'LUNA ROOM',district:'Бостандыкский район',img:'https://images.unsplash.com/photo-1633681926022-84c23e8cb2d6?w=700&q=80',masters:[{id:'s',name:'София',job:'Мастер ресниц'}],services:[{id:'lash',name:'Ламинирование ресниц',price:11000,duration:90,master:'s'}]}];
const KEY='sulugo-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.bookings||=[];state.availability||={};state.customServices||=[];let role='client',chosenSalon='nuva',chosenMaster='a',chosenService='nail',chosenDate=dateOffset(1),chosenTime='',masterId='a',filter='';const app=document.getElementById('app');function dateOffset(n){let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function findMaster(id){for(let s of salons){let m=s.masters.find(x=>x.id===id);if(m)return {...m,salon:s}}}function services(s){return [...s.services,...state.customServices.filter(x=>x.salon===s.id)]}function availKey(id,date){return id+'|'+date}function times(id,date){let k=availKey(id,date);if(!Object.prototype.hasOwnProperty.call(state.availability,k))return ['10:00','11:30','13:00','15:00','17:00','18:30'];return state.availability[k]}function occupied(id,date,time){return state.bookings.some(b=>b.master===id&&b.date===date&&b.time===time&&b.status!=='rejected'&&b.status!=='cancelled')}function fmt(n){return n.toLocaleString('ru-RU')+' ₸'}function statusText(s){return {pending:'Ожидает мастера',accepted:'Подтверждена',rejected:'Отклонена',cancelled:'Отменена'}[s]||s}function flash(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2700)}function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));app.innerHTML=role==='client'?clientHTML():role==='master'?masterHTML():ownerHTML();bind()}
function clientHTML(){let s=salons.find(x=>x.id===chosenSalon),sv=services(s),service=sv.find(x=>x.id===chosenService)||sv[0];if(!service){return ''}let master=s.masters.find(x=>x.id===chosenMaster)||s.masters[0];let free=times(master.id,chosenDate).filter(t=>!occupied(master.id,chosenDate,t));return `<section class="hero"><div><span class="eyebrow">Алматы · Beauty booking</span><h1>Твоя красота.<br>Твоё время.</h1><p>Найди мастера, выбери свободное окно и запишись за минуту.</p><span class="pill">Демонстрационная версия</span></div></section><h2 class="section">Салоны рядом</h2><div class="grid">${salons.map(x=>`<article class="card"><img src="${x.img}" alt="Иллюстрация салона"><div class="cardbody"><span class="muted">${x.district}</span><h3>${x.name}</h3><p class="muted">${x.masters.length} мастер(а) · от ${fmt(Math.min(...services(x).map(z=>z.price)))}</p><button class="primary" data-salon="${x.id}">Выбрать салон</button></div></article>`).join('')}</div><h2 class="section" id="booking">Записаться</h2><section class="panel"><div class="cols"><div class="field"><label>Салон</label><select id="salon">${salons.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label>Услуга</label><select id="service">${sv.map(x=>`<option value="${x.id}" ${x.id===service.id?'selected':''}>${x.name} · ${fmt(x.price)}</option>`).join('')}</select></div></div><div class="cols"><div class="field"><label>Мастер</label><select id="master">${s.masters.filter(m=>m.id===service.master).map(m=>`<option value="${m.id}">${m.name} · ${m.job}</option>`).join('')}</select></div><div class="field"><label>Дата</label><input id="date" type="date" min="${dateOffset(0)}" value="${chosenDate}"></div></div><p class="muted">Свободные часы мастера · ${service.duration} мин</p><div class="slots">${free.length?free.map(t=>`<button data-time="${t}" class="${chosenTime===t?'selected':''}">${t}</button>`).join(''):'<span class="muted">На этот день свободных часов нет</span>'}</div><div class="cols"><div class="field"><label>Имя клиента</label><input id="customer" maxlength="60" placeholder="Например, Аружан"></div><div class="field"><label>Телефон (демо, необязательно)</label><input id="phone" type="tel" placeholder="+7 700 000 00 00"></div></div><div class="notice">Стоимость: <b>${fmt(service.price)}</b> · Предоплата 20%: <b>${fmt(Math.round(service.price*.2))}</b> (только расчёт, списания нет). Мастер должен подтвердить заявку.</div><button id="book" class="primary" ${!chosenTime||!free.includes(chosenTime)?'disabled':''}>Отправить заявку</button></section><h2 class="section">Мои заявки на этом устройстве</h2><section class="panel">${state.bookings.length?state.bookings.slice().reverse().map(b=>bookingItem(b,'client')).join(''):'<p class="muted">Пока нет заявок. Выбери время и отправь первую!</p>'}</section>`}
function bookingItem(b,view){let m=findMaster(b.master),s=salons.find(x=>x.id===b.salon),sv=services(s).find(x=>x.id===b.service);return `<div class="item"><div class="row"><strong>${esc(b.customer)} · ${esc(sv?.name||'Услуга')}</strong><span class="pill">${statusText(b.status)}</span></div><p class="muted">${esc(s.name)} · ${esc(m?.name||'Мастер')} · ${b.date} в ${b.time} · ${fmt(b.price)}</p>${view==='master'&&b.status==='pending'?`<div class="actions"><button class="primary" data-accept="${b.id}">Принять</button><button class="danger" data-reject="${b.id}">Отклонить</button></div>`:''}${view==='client'&&['pending','accepted'].includes(b.status)?`<div class="actions"><button data-cancel="${b.id}">Отменить заявку</button></div>`:''}</div>`}
function masterHTML(){let m=findMaster(masterId),ts=times(masterId,chosenDate),bs=state.bookings.filter(b=>b.master===masterId);return `<h1 class="section">Кабинет мастера</h1><div class="notice">Демо-переключение ролей без пароля. В реальном продукте каждый мастер увидит только свои записи.</div><section class="panel"><div class="cols"><div class="field"><label>Войти как мастер</label><select id="masteraccount">${salons.flatMap(s=>s.masters.map(x=>`<option value="${x.id}" ${x.id===masterId?'selected':''}>${x.name} · ${s.name}</option>`)).join('')}</select></div><div class="field"><label>Рабочая дата</label><input id="date" type="date" min="${dateOffset(0)}" value="${chosenDate}"></div></div><h3>Мои рабочие часы</h3><p class="muted">Нажми, чтобы открыть или закрыть время. Часы с активными заявками нельзя закрыть.</p><div class="slots">${['09:00','10:00','11:30','13:00','15:00','17:00','18:30','20:00'].map(t=>`<button data-toggle="${t}" class="${ts.includes(t)?'selected':''}" ${occupied(masterId,chosenDate,t)?'disabled':''}>${t} ${occupied(masterId,chosenDate,t)?'🔒':ts.includes(t)?'✓':'+'}</button>`).join('')}</div><p class="tiny">Настройки сохраняются на этом устройстве.</p></section><h2 class="section">Заявки · ${m.name}</h2><section class="panel">${bs.length?bs.slice().reverse().map(b=>bookingItem(b,'master')).join(''):'<p class="muted">Заявок пока нет. Создай запись в разделе «Клиент».</p>'}</section>`}
function ownerHTML(){let total=state.bookings.length,accepted=state.bookings.filter(b=>b.status==='accepted'),revenue=accepted.reduce((n,b)=>n+b.price,0);return `<h1 class="section">Панель владельца</h1><div class="notice">Демо-панель показывает все три вымышленных салона для проверки сценариев. В реальном сервисе доступ будет ограничен салонами владельца.</div><div class="grid"><div class="stat"><span class="muted">Всего заявок</span><strong>${total}</strong></div><div class="stat"><span class="muted">Подтверждено</span><strong>${accepted.length}</strong></div><div class="stat"><span class="muted">Сумма подтверждённых записей</span><strong style="font-size:23px">${fmt(revenue)}</strong></div></div><h2 class="section">Добавить услугу</h2><section class="panel"><div class="cols"><div class="field"><label>Салон</label><select id="ownersalon">${salons.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="field"><label>Название услуги</label><input id="newservice" maxlength="65" placeholder="Например, вечерний макияж"></div><div class="field"><label>Мастер</label><select id="ownermaster">${salons[0].masters.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div><div class="field"><label>Стоимость, ₸</label><input id="newprice" type="number" min="500" max="1000000" value="15000"></div></div><button id="addservice" class="primary">Добавить услугу</button></section><h2 class="section">Все заявки</h2><section class="panel">${total?state.bookings.slice().reverse().map(b=>bookingItem(b,'owner')).join(''):'<p class="muted">Здесь появятся записи клиентов.</p>'}</section><button id="reset" class="danger">Сбросить все демоданные</button>`}
function bind(){document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;chosenTime='';render()});document.querySelectorAll('[data-salon]').forEach(b=>b.onclick=()=>{chosenSalon=b.dataset.salon;chosenService=services(salons.find(x=>x.id===chosenSalon))[0].id;chosenMaster=salons.find(x=>x.id===chosenSalon).masters[0].id;chosenTime='';render();document.getElementById('booking')?.scrollIntoView({behavior:'smooth'})});let s=document.getElementById('salon');if(s)s.onchange=()=>{chosenSalon=s.value;let salon=salons.find(x=>x.id===s.value);chosenService=services(salon)[0].id;chosenMaster=salon.masters[0].id;chosenTime='';render()};let sv=document.getElementById('service');if(sv)sv.onchange=()=>{chosenService=sv.value;chosenMaster=services(salons.find(x=>x.id===chosenSalon)).find(x=>x.id===sv.value).master;chosenTime='';render()};let dt=document.getElementById('date');if(dt)dt.onchange=()=>{chosenDate=dt.value;chosenTime='';render()};let ma=document.getElementById('masteraccount');if(ma)ma.onchange=()=>{masterId=ma.value;render()};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{chosenTime=b.dataset.time;document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('book').disabled=false});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let t=b.dataset.toggle,k=availKey(masterId,chosenDate),list=times(masterId,chosenDate).slice();state.availability[k]=list.includes(t)?list.filter(x=>x!==t):[...list,t].sort();save();render()});let book=document.getElementById('book');if(book)book.onclick=()=>{let name=document.getElementById('customer').value.trim(),phone=document.getElementById('phone').value.trim();if(!name){flash('Укажи имя клиента');return}if(!chosenTime||occupied(chosenMaster,chosenDate,chosenTime)||!times(chosenMaster,chosenDate).includes(chosenTime)){flash('Время уже недоступно');render();return}let svc=services(salons.find(x=>x.id===chosenSalon)).find(x=>x.id===chosenService);state.bookings.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,6),salon:chosenSalon,service:chosenService,master:chosenMaster,date:chosenDate,time:chosenTime,customer:name.slice(0,60),phone:phone.slice(0,25),price:svc.price,status:'pending'});save();chosenTime='';render();flash('Заявка создана! Переключись в кабинет мастера.')};for(let action of ['accept','reject','cancel'])document.querySelectorAll('[data-'+action+']').forEach(b=>b.onclick=()=>{let x=state.bookings.find(z=>z.id===b.dataset[action]);if(x){x.status={accept:'accepted',reject:'rejected',cancel:'cancelled'}[action];save();render();flash('Статус обновлён')}});let os=document.getElementById('ownersalon');if(os)os.onchange=()=>{document.getElementById('ownermaster').innerHTML=salons.find(x=>x.id===os.value).masters.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')};let add=document.getElementById('addservice');if(add)add.onclick=()=>{let name=document.getElementById('newservice').value.trim(),price=Number(document.getElementById('newprice').value);if(!name||price<500||price>1000000){flash('Проверь название и цену');return}state.customServices.push({id:'custom'+Date.now(),salon:document.getElementById('ownersalon').value,name:name.slice(0,65),price,duration:60,master:document.getElementById('ownermaster').value});save();render();flash('Услуга добавлена')};let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('Удалить все демозаписи, часы и добавленные услуги?')){state={bookings:[],availability:{},customServices:[]};save();render()}}}render();
</script></body></html>
