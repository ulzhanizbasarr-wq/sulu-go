function catalogPage(){const good=db.salons.filter(s=>s.status==='approved'),q=ui.catalogQuery.toLowerCase();const filt=good.filter(s=>(!q||[s.name,s.district,s.category,s.description,...s.services.map(x=>x.name)].join(' ').toLowerCase().includes(q))&&(!ui.catalogDistrict||ui.catalogDistrict===s.district)&&(!ui.catalogCategory||ui.catalogCategory===s.category));filt.sort((a,b)=>ui.catalogSort==='price'?Math.min(...a.services.map(x=>x.price))-Math.min(...b.services.map(x=>x.price)):(b.rating||0)-(a.rating||0));return `${pagehead('BEAUTY IN ALMATY',t('catalog'),ui.lang==='ru'?'Найди салон по услуге, району и стоимости.':'Find salons by service, location and price.')}<div class="filterbar"><input id="filterQuery" class="input" placeholder="${t('search')}" value="${att(ui.catalogQuery)}" maxlength="100"><select id="filterDistrict" class="input"><option value="">${t('all')} · ${t('district')}</option>${districts.map(d=>`<option ${ui.catalogDistrict===d?'selected':''}>${d}</option>`).join('')}</select><select id="filterCategory" class="input"><option value="">${t('all')} · ${t('services')}</option>${categories.map(([c])=>`<option ${ui.catalogCategory===c?'selected':''}>${c}</option>`).join('')}</select><select id="filterSort" class="input"><option value="rating" ${ui.catalogSort==='rating'?'selected':''}>★ ${t('rating')}</option><option value="price" ${ui.catalogSort==='price'?'selected':''}>${t('price')} ↑</option></select></div><p class="muted small" style="margin-bottom:15px">${number(filt.length)} ${ui.lang==='ru'?'салонов · данные для демонстрации':'salons · demo listings'}</p><div class="cols3">${filt.length?filt.map(salonCard).join(''):empty(t('noresults'))}</div>`}
function detailPage(){const s=getSalon(ui.salonId);if(!s||s.status!=='approved')return empty('Салон недоступен.');const reviews=db.reviews.filter(r=>r.salonId===s.id);return `<div class="pagehead"><button class="textlink" data-nav="catalog">← ${t('back')} · ${t('catalog')}</button><div class="row spread" style="margin-top:8px"><div><div class="caps">${esc(s.category)} · ${esc(s.district)}</div><h1>${esc(s.name)}</h1><p class="muted">📍 ${esc(s.address)} · ★ ${number(s.rating)} (${number(s.ratingCount)})</p></div><div class="row"><button class="btn outline" data-action="favorite" data-id="${att(s.id)}">♡ ${t('favourites')}</button><button class="btn" data-nav="book" data-id="${att(s.id)}">${t('book')} →</button></div></div></div><div class="cols2"><div>${cover(s,true)}<div class="panel" style="margin-top:17px"><h3>${t('description')}</h3><p class="muted">${esc(s.description)}</p><div class="row" style="margin-top:14px"><a class="btn subtle tiny" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address+', Алматы')}">↗ ${t('map')}</a><button class="btn outline tiny" data-action="message" data-id="${att(s.id)}">✉ ${t('message')}</button><button class="btn outline tiny" data-action="report" data-id="${att(s.id)}">⚑ ${t('report')}</button></div><p class="fine" style="margin-top:10px">${ui.lang==='ru'?'Адрес приведён в качестве примера, расположение не подтверждено.':'Demo address; not verified.'}</p></div></div><div class="stack"><div class="panel"><div class="row spread"><h3>${t('services')}</h3><span class="pill">${number(s.services.length)}</span></div><div class="list">${s.services.map(x=>`<div class="listitem row spread"><div><b>${esc(x.name)}</b><div class="muted small">◷ ${x.duration} мин</div></div><div style="text-align:right"><b>${money(x.price)}</b><div><button class="textlink small" data-nav="book" data-id="${att(s.id)}" data-service="${att(x.id)}">${t('book')} →</button></div></div></div>`).join('')}</div></div><div class="panel"><h3 style="margin-bottom:14px">${t('masters')}</h3><div class="stack">${s.masters.map(m=>`<div class="row">${avatar(m.name,'43px')}<div><b>${esc(m.name)}</b><p class="muted small">${esc(m.specialty||s.category)}</p></div>${m.userId?`<button class="btn tiny subtle" data-action="message" data-id="${att(s.id)}">✉ ${t('message')}</button>`:''}${m.portfolio?.length?`<div class="row" style="width:100%;margin-left:43px">${m.portfolio.slice(0,3).map(url=>`<img style="width:75px;height:70px;object-fit:cover;border-radius:10px" src="${att(url)}" alt="portfolio">`).join('')}</div>`:''}</div>`).join('')}</div></div><div class="panel"><h3>${t('reviews')}</h3><div class="row" style="margin:12px 0"><b style="font-size:22px">★ ${number(s.rating)}</b><span class="muted small">${number(s.ratingCount)} ${ui.lang==='ru'?'оценок (демо)':'demo ratings'}</span></div>${reviews.length?reviews.map(r=>`<div class="listitem"><span class="reviewstars">${'★'.repeat(r.stars)}</span><p class="small">${esc(r.text)}</p></div>`).join(''):'<p class="muted small">Пока нет отзывов от пользователей этой демоверсии.</p>'}<p class="fine" style="margin-top:10px">${ui.lang==='ru'?'Оставить отзыв можно после завершённого визита.':'Reviews can be posted after completed visits.'}</p></div></div></div>`}
function clockMinutes(x){const [h,m]=String(x||'0:0').split(':').map(Number);return h*60+m}
function clockText(minutes){return `${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`}
function availableSlots(s,m,service,date,excludeId=null){if(!s||!m||!service||!isDateValid(date))return[];const dm=new Date(`${date}T12:00:00`);const wd=dm.getDay();let open=clockMinutes(s.hours?.start||'09:00'),close=clockMinutes(s.hours?.end||'20:00');const profile=db.users.find(u=>u.id===m.userId);const sched=profile?.schedule;if(sched){if(Array.isArray(sched.days)&&!sched.days.includes(wd))return[];if(Array.isArray(sched.vacations)&&sched.vacations.includes(date))return[];open=Math.max(open,clockMinutes(sched.start||'09:00'));close=Math.min(close,clockMinutes(sched.end||'19:00'))}
const blocked=db.bookings.filter(b=>b.salonId===s.id&&b.masterId===m.id&&b.date===date&&b.id!==excludeId&&['pending','confirmed'].includes(b.status));const breaks=(sched?.blocks||[]).filter(b=>b.date===date);const out=[];for(let x=open;x+service.duration<=close;x+=30){if(date===dateLocal()&&x<=clockMinutes(nowHHMM()))continue;if(blocked.some(b=>{let start=clockMinutes(b.time);return x<start+b.duration&&x+service.duration>start}))continue;if(breaks.some(b=>x<clockMinutes(b.end)&&x+service.duration>clockMinutes(b.start)))continue;out.push(clockText(x))}return out}
function prepaymentInfo(s,price){let p=s.prepay||{type:'none',value:0};let due=p.type==='percent'?Math.round(price*Math.min(100,Math.max(0,p.value))/100):p.type==='fixed'?Math.min(price,Math.max(0,p.value)):0;return{due,policy:p.policy||''}}
function bookPage(){const s=getSalon(ui.salonId);if(!s||s.status!=='approved')return empty('Салон недоступен.');const edit=ui.rescheduleId?getBooking(ui.rescheduleId):null;if(edit&&edit.clientId!==active()?.id)ui.rescheduleId=null;
const serviceId=ui.bookServiceId||edit?.serviceId||s.services[0]?.id,mId=ui.bookMasterId||edit?.masterId||s.masters[0]?.id,d=ui.bookDate||edit?.date||dateLocal();const service=s.services.find(x=>x.id===serviceId)||s.services[0],master=s.masters.find(x=>x.id===mId)||s.masters[0];if(!service||!master)return empty('Нет доступных услуг и мастеров.');const times=availableSlots(s,master,service,d,edit?.id),selected=times.includes(ui.selectedTime)?ui.selectedTime:'';const pay=prepaymentInfo(s,service.price);return `<div class="pagehead"><button class="textlink" data-nav="detail" data-id="${att(s.id)}">← ${t('back')}</button><div class="caps">${t('online')}</div><h1>${edit?(ui.lang==='ru'?'Перенести запись':'Reschedule booking'):t('book')}</h1><p class="muted">${esc(s.name)} · ${esc(s.district)}</p></div><div class="cols2"><div class="panel"><h3 style="margin-bottom:17px">1 · ${t('services')} / ${t('masters')}</h3><div class="stack">${selectField(t('services'),'service',s.services.map(x=>[x.id,`${x.name} · ${money(x.price)} · ${x.duration} мин`]),service.id,'id="bookService"')}${selectField(t('masters'),'master',s.masters.map(x=>[x.id,x.name]),master.id,'id="bookMaster"')}${txtField(t('date'),'date',d,`id="bookDate" type="date" min="${dateLocal()}" max="${addDays(dateLocal(),30)}" required`)}<label class="field">2 · ${t('time')}</label>${times.length?`<div class="slotgrid">${times.map(time=>`<button type="button" class="slot ${selected===time?'sel':''}" data-action="slot" data-id="${time}">${time}</button>`).join('')}</div>`:empty(ui.lang==='ru'?'Нет свободных окон на эту дату. Попробуй другой день или мастера.':'No free slots on this day.')}</div></div><div class="stack"><div class="panel"><h3>${ui.lang==='ru'?'Детали визита':'Visit summary'}</h3><div class="list"><div class="listitem row spread"><span>${t('services')}</span><b>${esc(service.name)}</b></div><div class="listitem row spread"><span>${t('masters')}</span><b>${esc(master.name)}</b></div><div class="listitem row spread"><span>${t('price')}</span><b>${money(service.price)}</b></div><div class="listitem">${txtField(ui.lang==='ru'?'Промокод (необязательно)':'Promo code','promo',ui.promo||'','id="promoInput" placeholder="SULU10" maxlength="25"')}</div><div class="listitem row spread"><span>${ui.lang==='ru'?'Предоплата по правилам салона':'Salon deposit'}</span><b>${money(pay.due)}</b></div></div><p class="fine">${esc(pay.policy||'Предоплата в этой демоверсии не взимается. Стоимость и условия нужно подтвердить перед реальной записью.')}</p></div><div class="panel"><h3>${ui.lang==='ru'?'Пожелания':'Preferences'}</h3><label class="switchrow"><span>🤫 Quiet Beauty</span><input type="checkbox" id="bookingQuiet" ${active()?.quiet?'checked':''}></label><label class="field" style="margin:12px 0">${ui.lang==='ru'?'Комментарий мастеру':'Note to professional'}<textarea id="bookingNote" class="input" maxlength="400" rows="3" placeholder="${ui.lang==='ru'?'Например: без фото, пожалуйста':'Any special requests?'}"></textarea></label><div class="alert">${ui.lang==='ru'?'Демо: запись сохраняется только на этом устройстве. Мастер не получит реальное уведомление.':'Demo: saved on this device only. No real notification is delivered.'}</div><button class="btn block" ${!selected?'disabled':''} data-action="submit-booking" data-id="${att(s.id)}">${edit?'Перенести запись':'Подтвердить запись (демо)'} →</button></div></div></div>`}
function submitBooking(){const s=getSalon(ui.salonId);if(!s||s.status!=='approved')return;const user=active();if(!user){ui.loginTab='signup';route('account');notify('Сначала создай демопрофиль.');return}let service=s.services.find(x=>x.id===(document.getElementById('bookService')?.value)),m=s.masters.find(x=>x.id===document.getElementById('bookMaster')?.value),date=document.getElementById('bookDate')?.value,time=ui.selectedTime;if(!service||!m||!date||!time)return notify('Выбери услугу, мастера, дату и время.');if(date<dateLocal()||date>addDays(dateLocal(),30))return notify('Можно записаться только на ближайшие 30 дней.');if(!availableSlots(s,m,service,date,ui.rescheduleId).includes(time))return notify('Это время уже занято. Выбери другое.');const promo=(document.getElementById('promoInput')?.value||'').trim().toUpperCase(),p=db.promoCodes.find(x=>x.code===promo&&x.active);let price=Math.max(0,Math.round(service.price*(1-(p?.percent||0)/100)));let note=(document.getElementById('bookingNote')?.value||'').trim().slice(0,400);let b=ui.rescheduleId?getBooking(ui.rescheduleId):null;if(b){if(b.clientId!==user.id||!['pending','confirmed'].includes(b.status))return notify('Перенести эту запись уже нельзя.');Object.assign(b,{date,time,serviceId:service.id,masterId:m.id,serviceName:service.name,masterName:m.name,duration:service.duration,price,promo,notes:note,quiet:!!document.getElementById('bookingQuiet')?.checked,status:'pending',updatedAt:new Date().toISOString()});notice(user.id,'Запись перенесена',`${s.name} · ${date} ${time}`);notice(m.userId,'Клиент перенёс запись',`${service.name} · ${date} ${time}`)}else{b={id:id(),salonId:s.id,clientId:user.id,clientName:user.name,serviceId:service.id,masterId:m.id,serviceName:service.name,masterName:m.name,date,time,duration:service.duration,price,prepay:prepaymentInfo(s,price).due,promo,notes:note,quiet:!!document.getElementById('bookingQuiet')?.checked,status:'pending',createdAt:new Date().toISOString()};db.bookings.push(b);notice(user.id,'Заявка на запись создана',`${s.name} · ${date} ${time}`);notice(m.userId,'Новая запись',`${service.name} · ${date} ${time}`);notice(s.ownerId,'Новая запись',`${service.name} · ${date} ${time}`)}save();ui.bookServiceId=null;ui.bookMasterId=null;ui.bookDate=null;ui.selectedTime='';ui.rescheduleId=null;ui.promo='';route('bookings');notify('Демо-запись создана. Реальное сообщение мастеру не отправлено.')}

/strong><span>${t('bookings')}</span></div><div class="stat"><strong>${money(ownBookings.filter(b=>b.status==='completed').reduce((sum,b)=>sum+b.price,0))}</strong><span>${ui.lang==='ru'?'Сумма услуг (не выручка)':'Value of services'}</span></div><div class="stat"><strong>${db.reviews.filter(r=>mine.some(s=>s.id===r.salonId)).length}</strong><span>${t('reviews')}</span></div></div><p class="fine">Все показатели рассчитываются только по локальным демоданным. Реальных оплат и продаж нет.</p></div>`:`<div class="panel"><div class="row spread" style="margin-bottom:15px"><div><h3>${t('mySalons')}</h3><p class="muted small">${ui.lang==='ru'?'Новые салоны видны клиентам только после одобрения администратором.':'New salons are only published after admin approval.'}</p></div><button class="btn" data-action="new-salon">＋ ${t('add')}</button></div>${mine.length?mine.map(s=>`<div class="listitem row spread"><div><b>${esc(s.name)}</b><div class="row" style="margin-top:6px">${statusChip(s.status)}<span class="muted small">${esc(s.district)} · ${esc(s.address)}</span></div></div><div class="row"><button class="btn tiny outline" data-nav="salonedit" data-id="${att(s.id)}">${t('edit')}</button>${s.status==='approved'?`<button class="btn tiny subtle" data-nav="detail" data-id="${att(s.id)}">${t('view')}</button>`:''}</div></div>`).join(''):empty(ui.lang==='ru'?'Ты ещё не добавила салон. Создай заявку — она получит статус «На проверке».':'Create a salon application to get started.')}</div><div class="alert warn" style="margin-top:18px">🔒 ${ui.lang==='ru'?'Одобрение салона, блокировка пользователей и админ-панель недоступны в публичном демосайте. Для них нужен защищённый сервер и назначение администратора.':'Real approval and admin controls require a protected backend.'}</div>`}`}

n to publish.'}</p>`:ui.tab==='services'?`<h3>${t('priceList')}</h3><div class="list">${s.services.map(x=>`<div class="listitem row spread"><div><b>${esc(x.name)}</b><p class="muted small">${money(x.price)} · ${x.duration} мин</p></div><div class="row"><button class="btn tiny outline" data-action="edit-service" data-id="${att(x.id)}">${t('edit')}</button><button class="btn tiny subtle" data-action="delete-service" data-id="${att(x.id)}">×</button></div></div>`).join('')||empty('Добавь первую услугу.')}</div><div class="divider"></div><h3>${t('add')} · ${t('services')}</h3><form class="formgrid" id="addService" style="margin-top:15px">${txtField(t('name'),'name','','required maxlength="90"')}${txtField(t('price')+' · ₸','price','','required type="number" min="0" max="1000000"')}${txtField(ui.lang==='ru'?'Длительность (мин)':'Duration (min)','duration','60','required type="number" min="15" max="480"')}<div style="align-self:end"><button class="btn block">＋ ${t('add')}</button></div></form>`:ui.tab==='team'?`<h3>${t('masters')}</h3><p class="fine" style="margin:8px 0 14px">${ui.lang==='ru'?'Выдай мастеру индивидуальный код приглашения. Он введёт его в своём кабинете. Коды существуют только в этой локальной демоверсии.':'Give each professional an invite code. It only works inside this browser.'}</p><div class="list">${s.masters.map(m=>`<div class="listitem row spread"><div class="row">${avatar(m.name,'42px')}<div><b>${esc(m.name)}</b><p class="small muted">${m.userId?'✓ '+(ui.lang==='ru'?'Подключён':'Linked'):`Код: ${esc(m.invite||'—')}`}</p></div></div><button class="btn tiny subtle" data-action="remove-master" data-id="${att(m.id)}">×</button></div>`).join('')||empty('Добавь мастера.')}</div><form class="formgrid" id="addMaster" style="margin-top:17px">${txtField(ui.lang==='ru'?'Имя мастера':'Professional name','name','','required maxlength="60"')}${txtField(ui.lang==='ru'?'Специализация':'Specialty','specialty',s.category,'required maxlength="80"')}<button class="btn function createSalon(f){const u=active();if(!u||u.currentRole!=='owner')return;const name=String(f.get('name')||'').trim(),desc=String(f.get('description')||'').trim(),address=String(f.get('address')||'').trim();if(name.length<2||desc.length<15||address.length<5)return notify('Заполни название, адрес и описание салона.');if(mySalon().length>=6)return notify('В деморежиме можно создать до 6 салонов.');const s={id:id(),ownerId:u.id,name,category:String(f.get('category')),district:String(f.get('district')),address,description:desc,phone:String(f.get('phone')||''),status:'pending',photo:'',rating:5,ratingCount:0,masters:[],services:[],hours:{start:'09:00',end:'20:00'},prepay:{type:'none',value:0,policy:''},branches:[],plan:'Start',trialStart:dateLocal(),createdAt:new Date().toISOString()};db.salons.push(s);save();closeModal();ui.salonId=s.id;ui.tab='info';route('salonedit');notify('Заявка сохранена локально со статусом «На проверке». Администратору не отправлена.')}
function updateSalonForm(form){let s=getSalon(ui.salonId);if(!isOwner(s))return;const f=new FormData(form);const type=form.id;if(type==='salonInfoForm'){const before=[s.name,s.district,s.category,s.address,s.photo];s.name=String(f.get('name')||'').trim().slice(0,90);s.district=String(f.get('district'));s.category=String(f.get('category'));s.address=String(f.get('address')||'').trim();s.description=String(f.get('description')||'').trim().slice(0,1000);let photo=String(f.get('photo')||'');if(photo.trim()&&photoUrl(photo))s.photo=photo.trim();else if(photo.trim())return notify('Для URL фото используй Unsplash, Pexels или Pixabay.');if(s.status==='approved'&&JSON.stringify(before)!==JSON.stringify([s.name,s.district,s.category,s.address,s.photo])){s.status='pending';notify('Изменения карточки требуют повторной проверки перед публикацией.')}}else if(type==='addService'){const name=String(f.get('name')||'').trim(),price=+f.get('price'),duration=+f.get('duration');if(!name||price<0||duration<15||duration>480)return notify('Проверь название, цену и длительность.');s.services.push({id:id(),name,price,duration})}else if(type==='addMaster'){const name=String(f.get('name')||'').trim();if(!name)return;const code='SG-'+Math.random().toString(36).slice(2,8).toUpperCase();s.masters.push({id:id(),name,specialty:String(f.get('specialty')||''),userId:null,invite:code,portfolio:[]})}else if(type==='salonHours'){let start=String(f.get('start')),end=String(f.get('end'));if(clockMinutes(start)>=clockMinutes(end))return notify('Время закрытия должно быть позже открытия.');s.hours={start,end}}else if(type==='depositForm'){let type=String(f.get('type')),value=Math.max(0,Number(f.get('value'))||0);if(type==='percent'&&value>100)return notify('Процент не может превышать 100%.');s.prepay={type,value,policy:String(f.get('policy')||'').slice(0,700)}}else if(type==='addBranch'){s.branches.push({name:String(f.get('name')||'').trim(),address:String(f.get('address')||'').trim()})}save();render();notify('Изменения салона сохранены локально.')}
function masterSalon(u){return db.salons.find(s=>s.id===u?.linkedSalon&&s.masters.some(m=>m.userId===u?.id))||null}
function masterPage(){const u=active();if(!u||u.currentRole!=='master')return empty('Выбери роль мастера в настройках.');const s=masterSalon(u),myRecord=s?.masters.find(m=>m.userId===u.id);const jobs=db.bookings.filter(b=>b.masterId===myRecord?.id&&b.salonId===s?.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));const schedule=u.schedule||{days:[1,2,3,4,5,6],start:'10:00',end:'19:00',vacations:[],blocks:[]};return `${pagehead('SULU GO · PRO',ui.lang==='ru'?'Кабинет мастера':'Professional dashboard',ui.lang==='ru'?'Твои услуги, портфолио, свободные часы и записи.':'Your services, portfolio, availability and bookings.')}<div class="panel" style="margin-bottom:19px"><div class="row" style="gap:14px">${avatar(u.name,'60px')}<div style="flex:1"><h3>${esc(u.name)}</h3><p class="muted small">${s?`${esc(s.name)} · ${esc(s.district)}`:ui.lang==='ru'?'Не привязан к салону':'No salon linked yet'}</p></div><span class="pill">${t('master')} · ${t('demo')}</span></div>${!s?`<div class="divider"></div><p class="muted small">${ui.lang==='ru'?'Попроси владельца салона добавить тебя в команду и передать код приглашения.':'Ask your salon owner for an invitation code.'}</p><form id="joinSalon" class="row" style="margin-top:12px"><input class="input" style="flex:1" name="invite" maxlength="20" placeholder="SG-XXXXXX" required><button class="btn">${ui.lang==='ru'?'Подключиться':'Join salon'}</button></form>`:''}</div><div class="cols4" style="margin-bottom:20px"><div class="stat"><strong>${jobs.filter(b=>b.status==='pending').length}</strong><span>${t('requests')}</span></div><div class="stat"><strong>${jobs.filter(b=>b.status==='confirmed').length}</strong><span>${t('bookings')}</span></div><div class="stat"><strong>${(s?.services||u.services||[]).length}</strong><span>${t('services')}</span></div><div class="stat"><strong>${schedule.vacations?.length||0}</strong><span>${ui.lang==='ru'?'Выходные дни':'Days off'}</span></div></div><div class="tabs">${[['appointments',t('bookings')],['services',t('priceList')],['schedule',t('schedule')],['portfolio',ui.lang==='ru'?'Портфолио':'Portfolio']].map(([k,label])=>`<button class="tab ${ui.tab===k?'sel':''}" data-action="tab" data-id="${k}">${label}</button>`).join('')}</div><div class="panel">${ui.tab==='services'?`<h3>${t('priceList')}</h3><p class="fine" style="margin:9px 0">${s?'Изменения стоимости в связанном салоне сразу отражаются в локальном демокаталоге.':'Прайс без привязки к салону сохраняется только в твоём профиле.'}</p><div class="list">${(s?.services||u.services||[]).map(x=>`<div class="listitem row spread"><div><b>${esc(x.name)}</b><p class="muted small">${money(x.price)} · ${x.duration} мин</p></div><button class="btn tiny outline" data-action="edit-master-service" data-id="${att(x.id)}">${t('edit')}</button></div>`).join('')||empty('Добавь услуги.')}</div><div class="divider"></div><form id="addMasterService" class="formgrid">${txtField(t('name'),'name','','required maxlength="90"')}${txtField(t('price')+' ₸','price','','required type="number" min="0" max="1000000"')}${txtField(ui.lang==='ru'?'Длительность (мин)':'Minutes','duration','60','required type="number" min="15" max="480"')}<div style="align-self:end"><button class="btn block">＋ ${t('add')}</button></div></form>`:ui.tab==='schedule'?`<h3>${t('schedule')}</h3><form id="masterSchedule" class="stack" style="margin-top:16px"><p class="muted small">${ui.lang==='ru'?'Рабочие дни недели':'Working weekdays'}</p><div class="row">${[['1','Пн'],['2','Вт'],['3','Ср'],['4','Чт'],['5','Пт'],['6','Сб'],['0','Вс']].map(([v,txt])=>`<label class="pill"><input type="checkbox" name="day" value="${v}" ${(schedule.days||[]).includes(+v)?'checked':''}>${txt}</label>`).join('')}</div><div class="formgrid">${txtField(ui.lang==='ru'?'Начало':'Starts','start',schedule.start,'required type="time"')}${txtField(ui.lang==='ru'?'Конец':'Ends','end',schedule.end,'required type="time"')}</div><button class="btn">${t('save')}</button></form><div class="divider"></div><h3>${ui.lang==='ru'?'Отпуск и выходные':'Vacations & days off'}</h3><form id="addVacation" class="row" style="margin:15px 0"><input class="input" style="max-width:200px" name="date" type="date" min="${dateLocal()}" required><button class="btn">＋ ${t('add')}</button></form><div class="row">${schedule.vacations?.length?schedule.vacations.map(d=>`<button class="pill" data-action="vacation-remove" data-id="${att(d)}">${d} ×</button>`).join(''):'<p class="muted small">Дни отпуска пока не добавлены.</p>'}</div><div class="divider"></div><h3>${ui.lang==='ru'?'Перерывы в отдельные дни':'One-day breaks'}</h3><form id="addBreak" class="formgrid" style="margin:16px 0">${txtField(t('date'),'date',dateLocal(),'required type="date"')}${txtField(ui.lang==='ru'?'С':'From','start','13:00','required type="time"')}${txtField(ui.lang==='ru'?'До':'To','end','14:00','required type="time"')}<div style="align-self:end"><button class="btn">＋ ${t('add')}</button></div></form><div class="row">${(schedule.blocks||[]).map(b=>`<button class="pill" data-action="break-remove" data-id="${att(b.id)}">${esc(b.date)} · ${esc(b.start)}–${esc(b.end)} ×</button>`).join('')||'<p class="muted small">Перерывов нет.</p>'}</div>`:ui.tab==='portfolio'?`<h3>${ui.lang==='ru'?'Портфолио работ':'Portfolio'}</h3><p class="fine" style="margin:9px 0 16px">${ui.lang==='ru'?'Используй только фотографии работ с разрешения клиентов.':'Upload only work photos with client permission.'}</p><div class="cols3">${(u.portfolio||[]).map((photo,i)=>`<div class="panel" style="padding:8px"><img src="${att(photo)}" alt="Portfolio" loading="lazy" style="width:100%;height:130px;object-fit:cover;border-radius:10px"><button class="btn tiny subtle block" data-action="portfolio-remove" data-id="${i}">${t('delete')}</button></div>`).join('')||'<p class="muted small">Работ пока нет.</p>'}</div><label class="field" style="margin-top:17px">${t('photo')}<input class="input" id="portfolioUpload" type="file" accept="image/jpeg,image/png,image/webp"></label>`:`<h3>${t('requests')}</h3>${jobs.length?jobs.map(b=>bookingItem(b,'master')).join(''):empty('Новых записей пока нет. Заявки появляются у привязанных к салону мастеров.')}`}</div>`}
function joinSalon(f){const u=active();if(!u||u.currentRole!=='master')return;let code=String(f.get('invite')||'').trim().toUpperCase();let target=null,m=null;for(const s of db.salons){const found=s.masters.find(x=>x.invite===code&&!x.userId);if(found){target=s;m=found;break}}if(!target||!m)return notify('Код не найден или уже использован.');if(u.linkedSalon&&u.linkedSalon!==target.id)return notify('Сначала отсоединись от предыдущего салона.');m.userId=u.id;m.name=u.name;delete m.invite;u.linkedSalon=target.id;save();render();notify('Код принят: мастер подключён к салону в демобазе.')}

function featureSubmit(form){const f=new FormData(form),kind=form.id,u=active();const requireLogin=()=>{if(u)return true;route('account');notify('Чтобы сохранить, создай демопрофиль.');return false};if(kind==='dayPlanner'){let entries=f.getAll('service').slice(0,8).map(pair=>{const [sid,svid]=String(pair).split('|');let s=getSalon(sid),svc=s?.services.find(x=>x.id===svid);return s&&svc?{s,svc}:null}).filter(Boolean),start=clockMinutes(f.get('time'));if(!entries.length)return notify('Выбери услуги.');let total=0;output(`<b>Beauty Day · ${esc(f.get('date'))}</b>${entries.map(({s,svc},i)=>{let st=start;start+=svc.duration;if(i<entries.length-1)start+=30;total+=svc.price;return `<div class="listitem"><b>${clockText(st)}–${clockText(st+svc.duration)}</b> · ${esc(svc.name)} · ${esc(s.name)} · ${money(svc.price)}</div>`}).join('')}<b>Итого ориентировочно: ${money(total)}</b><p class="fine">На дорогу условно добавлено по 30 минут. Время и доступность не подтверждены.</p>`)}else if(kind==='matchForm'){let cat=String(f.get('category')||''),district=String(f.get('district')||''),budget=+f.get('budget');let matched=db.salons.filter(s=>s.status==='approved'&&(!cat||s.category===cat)&&(!district||s.district===district)&&Math.min(...s.services.map(x=>x.price))<=budget);output(matched.length?matched.map(s=>`<div class="listitem row spread"><b>${esc(s.name)}</b><button class="btn tiny" data-nav="detail" data-id="${att(s.id)}">${t('details')}</button></div>`).join(''):t('noresults'))}else if(kind==='estimateForm'){let [sid,svid]=String(f.get('service')||'').split('|'),svc=getSalon(sid)?.services.find(x=>x.id===svid);if(!svc)return;let extra=(f.get('removal')?1500:0)+(f.get('design')?2000:0)+(f.get('extras')?3000:0);output(`<div class="row spread"><span>${t('price')}</span><b>${money(svc.price)}</b></div><div class="row spread"><span>${ui.lang==='ru'?'Доплаты':'Extras'}</span><b>${money(extra)}</b></div><hr class="divider"><h3>${ui.lang==='ru'?'Итого ориентировочно':'Estimated total'} function sendMessageModal(sid){const s=getSalon(sid),linked=s?.masters.filter(m=>m.userId);if(!active())return route('account');if(!linked?.length)return notify('У этого демосалона нет подключённых профилей мастеров для переписки.');openModal('✉ '+(ui.lang==='ru'?'Сообщение мастеру':'Message professional'),`<form id="messageForm" data-id="${att(sid)}" class="stack">${selectField(t('masters'),'master',linked.map(m=>[m.id,m.name]))}${areaField(t('message'),'text','','required minlength="2" maxlength="1000"')}<div class="alert">${ui.lang==='ru'?'Сообщение появится в локальном разделе уведомлений получателя только в этом браузере.':'Local demo messages only.'}</div><button class="btn">${t('send')}</button></form>`)}
function logoutConfirm(){if(confirm('Выйти из демопрофиля?'))logout()}
async function toSmallImage(file){if(!file||!file.type.match(/^image\/(jpeg|png|webp)$/))throw new Error('Нужен JPG, PNG или WebP.');if(file.size>10*1024*1024)throw new Error('Файл больше 10 МБ.');const blob=URL.createObjectURL(file);try{const image=await new Promise((ok,fail)=>{const img=new Image;img.onload=()=>ok(img);img.onerror=()=>fail(new Error('Не удалось прочитать изображение.'));img.src=blob});const scale=Math.min(1,700/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.65);if(data.length>450000)throw new Error('После сжатия фото слишком большое.');return data}finally{URL.revokeObjectURL(blob)}}
function exportDemo(){const u=active();const payload={warning:'Local demo data, NOT production data.',profile:u&&{name:u.name,email:u.email,roles:u.roles},bookings:personBookings(),favorites:db.favorites[u?.id]||[],vouchers:db.vouchers.filter(g=>g.buyerId===u?.id),moods:db.moods[u?.id]||[],passport:db.passport[u?.id]||[]};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sulu-go-my-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);notify('Скопировано.')}catch{prompt('Скопируй текст:',txt)}}

if(action==='booking-filter'){ui.filterMine=val;return render()}

if(action==='booking-confirm')return changeBookingStatus(val,'confirm');
if(action==='booking-reject')return changeBookingStatus(val,'reject');

if(action==='reschedule'){const b=getBooking(val);if(!b||b.clientId!==active()?.id)return;ui.rescheduleId=b.id;ui.bookServiceId=b.serviceId;ui.bookMasterId=b.masterId;ui.bookDate=b.date;ui.selectedTime=b.time;return route('book',b.salonId)}

if(action==='vacation-remove'){let u=active();u.schedule.vacations=u.schedule.vacations.filter(x=>x!==val);save();return render()}
if(action==='break-remove'){let u=active();u.schedule.blocks=u.schedule.blocks.filter(x=>x.id!==val);save();return render()}
if(action==='portfolio-remove'){const u=active();if(u?.currentRole!=='master')return;u.portfolio.splice(Number(val),1);let s=masterSalon(u),m=s?.masters.find(x=>x.userId===u.id);if(m)m.portfolio=[...u.portfolio];save();return render()}
if(action==='select-plan'){const salon=mySalon();if(!salon.length)return notify('Сперва создай заявку салона.');return openModal('SULU GO '+val,`<p class="muted small" style="margin-bottom:13px">Демо-выбор тарифа. Никаких списаний.</p><div class="stack">${salon.map(s=>`<button class="btn subtle" data-action="set-plan" data-id="${att(s.id)}" data-plan="${att(val)}">${esc(s.name)} → ${esc(val)}</button>`).join('')}</div>`)}
if(action==='set-plan'){const s=getSalon(val);if(!isOwner(s))return;s.plan=a.dataset.plan;save();closeModal();render();return notify('Демотариф выбран. Оплата не подключена.')}
if(action==='feature'){ui.featureKey=val;return route('features')}
if(action==='delete-mood'){let arr=db.moods[active()?.id]||[];db.moods[active().id]=arr.filter(x=>x.id!==val);save();return render()}
if(action==='delete-passport'){let arr=db.passport[active()?.id]||[];db.passport[active().id]=arr.filter(x=>x.id!==val);save();return render()}
if(action==='now-slot'){ui.bookDate=dateLocal();ui.selectedTime=a.dataset.time;ui.bookMasterId=getSalon(val)?.masters[0]?.id;ui.bookServiceId=getSalon(val)?.services[0]?.id;return route('book',val)}
if(action==='share-gift'||action==='copy-gift'){const g=db.vouchers.find(x=>x.id===val);if(!g||!(g.buyerId===active()?.id||g.claimedBy===active()?.id))return;let msg=`SULU GO ✿ — DEMO (НЕ ОПЛАЧЕНО)\nДля: ${g.recipient}\nПодарок: ${g.kind}\nКод: ${g.code}\nЭто тестовый сертификат, в салоне он не действует.`;if(action==='share-gift'&&navigator.share){try{await navigator.share({title:'SULU GO Gift · DEMO',text:msg})}catch{}}else return copyText(msg);return}
if(action==='export-demo')return exportDemo();
if(action==='delete-account'){const u=active();if(!u||!confirm('Удалить демопрофиль и связанные с ним локальные данные? Действие нельзя отменить.'))return;db.bookings=db.bookings.filter(b=>b.clientId!==u.id);db.vouchers=db.vouchers.filter(g=>g.buyerId!==u.id);db.notices=db.notices.filter(n=>n.to!==u.id);db.messages=db.messages.filter(m=>m.to!==u.id&&m.from!==u.id);db.salons=db.salons.filter(s=>s.ownerId!==u.id);db.users=db.users.filter(x=>x.id!==u.id);delete db.favorites[u.id];delete db.moods[u.id];delete db.passport[u.id];db.activeId=null;save();return route('account')}
});
document.addEventListener('submit',e=>{const form=e.target;if(!form.id)return;e.preventDefault();const f=new FormData(form);switch(form.id){case'heroSearch':ui.catalogQuery=String(f.get('q')||'').trim();ui.catalogDistrict=String(f.get('district')||'');ui.catalogCategory='';return route('catalog');case'registerForm':return createUser(f);case'loginForm':return loginUser(f);case'profileForm':{const u=active();if(!u)return;let name=String(f.get('name')||'').trim();if(name.length<2)return notify('Имя слишком короткое.');u.name=name.slice(0,60);save();render();return notify('Профиль сохранён.')}case'notificationsForm':{let u=active();if(!u)return;u.preferences={inapp:!!f.get('inapp'),email:!!f.get('email'),whatsapp:!!f.get('whatsapp')};save();return notify('Предпочтения сохранены. Реальная отправка Email и WhatsApp не работает.')}case'createSalon':return createSalon(f);case'salonInfoForm':case'addService':case'addMaster':case'salonHours':case'depositForm':case'addBranch':return updateSalonForm(form);case'joinSalon':return joinSalon(f);case'addMasterService':case'masterSchedule':case'addVacation':case'addBreak':return updateMasterForm(form);case'editService':return editServiceSubmit(form);case'giftForm':return giftSubmit(f);case'redeemGift':{const u=active();if(!u)return route('account');let code=String(f.get('code')||'').trim().toUpperCase(),g=db.vouchers.find(g=>g.code===code);if(!g)return notify('Код не найден в этом браузере.');if(g.claimedBy)return notify('Демо-код уже отмечен как использованный.');if(!confirm('Отметить демо-код как использованный? Настоящей оплаты не было.'))return;g.claimedBy=u.id;save();render();return notify('Демо-код отмечен как использованный. Он не имеет денежной стоимости.')}case'reviewForm':{let b=getBooking(form.dataset.id),u=active();if(!b||b.clientId!==u?.id||b.status!=='completed'||db.reviews.some(x=>x.bookingId===b.id))return;let stars=+f.get('stars'),text=String(f.get('text')||'').trim();if(stars<1||stars>5||text.length<8)return notify('Оцени визит и напиши несколько слов.');db.reviews.push({id:id(),bookingId:b.id,salonId:b.salonId,clientId:u.id,stars,text,at:new Date().toISOString()});let s=getSalon(b.salonId);s.rating=+( (s.rating*s.ratingCount+stars)/(s.ratingCount+1)).toFixed(2);s.ratingCount++;save();closeModal();render();return notify('Отзыв опубликован только в локальной демоверсии.')}case'reportForm':{let u=active();if(!u)return route('account');let details=String(f.get('details')||'').trim();if(details.length<10)return notify('Добавь подробности жалобы.');db.reports.push({id:id(),reporterId:u.id,salonId:form.dataset.id,reason:String(f.get('reason')),details,status:'pending',at:new Date().toISOString()});save();closeModal();return notify('Жалоба сохранена локально, администратору не отправлена.')}case'messageForm':{const u=active(),s=getSalon(form.dataset.id),m=s?.masters.find(x=>x.id===f.get('master'));if(!u||!m?.userId)return notify('Мастер не подключён.');let text=String(f.get('text')||'').trim();if(text.length<2)return;db.messages.push({id:id(),from:u.id,to:m.userId,subject:`${u.name} → ${m.name}`,text,at:new Date().toISOString()});notice(m.userId,'Новое сообщение',`${u.name}: ${text.slice(0,80)}`);save();closeModal();return notify('Сообщение сохранено локально. Вне этого браузера оно недоступно.')}case'dayPlanner':case'matchForm':case'estimateForm':case'friendsForm':case'moodForm':case'passportForm':case'quietForm':return featureSubmit(form)}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='langSetting'){ui.lang=el.value;localStorage.setItem('sg-language',ui.lang);return render()}if(el.id==='themeSetting'){ui.theme=el.value;localStorage.setItem('sg-theme',ui.theme);return render()}
if(el.id==='filterDistrict'){ui.catalogDistrict=el.value;return render()}if(el.id==='filterCategory'){ui.catalogCategory=el.value;return render()}if(el.id==='filterSort'){ui.catalogSort=el.value;return render()}
if(el.id==='bookService'){ui.bookServiceId=el.value;ui.selectedTime='';return render()}if(el.id==='bookMaster'){ui.bookMasterId=el.value;ui.selectedTime='';return render()}if(el.id==='bookDate'){ui.bookDate=el.value;ui.selectedTime='';return render()}
if(el.id==='giftType'){ui.giftType=el.value;return render()}if(el.id==='giftStyle'){const prev=document.getElementById('giftPreview');if(prev)prev.className='giftcard '+(el.value==='rose'?'':el.value);return}
if(['salonPhotoUpload','portfolioUpload'].includes(el.id)&&el.files?.[0]){try{let data=await toSmallImage(el.files[0]);if(el.id==='salonPhotoUpload'){let s=getSalon(ui.salonId);if(!isOwner(s))return;s.photo=data;save();notify('Фото сохранено в браузере.') }else{let u=active();if(!u||u.currentRole!=='master')return;if(u.portfolio.length>=6)return notify('В демо можно загрузить до 6 работ.');u.portfolio.push(data);const s=masterSalon(u),m=s?.masters.find(x=>x.userId===u.id);if(m)m.portfolio=[...u.portfolio];save();render();notify('Фото работы сохранено локально.')}}catch(err){notify(err.message||'Ошибка изображения.')}}});
let filterTimer;document.addEventListener('input',e=>{if(e.target.id==='filterQuery'){clearTimeout(filterTimer);let v=e.target.value;filterTimer=setTimeout(()=>{ui.catalogQuery=v;render();let field=document.getElementById('filterQuery');field?.focus();field?.setSelectionRange(v.length,v.length)},340)}});

// Restore only visual preferences from older prototypes. Old unprotected profiles are deliberately not imported.
// This avoids silently mixing old accounts and bookings into a new data model.
function localReminders(){const u=active();if(!u||u.preferences?.inapp===false)return;const now=new Date();for(const b of db.bookings){if(b.clientId!==u.id||b.status!=='confirmed')continue;let when=new Date(`${b.date}T${b.time}:00`);let hours=(when-now)/3600000;if(hours<0||hours>24)continue;const key='remind-'+b.id+'-'+b.date+'-'+b.time;if(db.notices.some(n=>n.dedupe===key))continue;db.notices.unshift({id:id(),to:u.id,title:'Напоминание о записи',text:`${b.serviceName} · ${b.date} ${b.time}`,kind:'reminder',read:false,dedupe:key,at:new Date().toISOString()})}save()}
function start(){if(!['ru','kk','en'].includes(ui.lang))ui.lang='ru';if(!['rose','minimal','midnight','champagne'].includes(ui.theme))ui.theme='rose';bindActions();localReminders();if(active()?.currentRole==='master'){ui.page='master';ui.tab='appointments'}else if(active()?.currentRole==='owner'){ui.page='owner';ui.tab='overview'}render()}
start();
